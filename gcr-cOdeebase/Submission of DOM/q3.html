<!-- Q3_multi_step_form -->

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Step Form</title><style>body{font:16px Arial;max-width:520px;margin:40px auto;padding:0 16px}.step{display:none}.step.active{display:block}input{box-sizing:border-box;width:100%;padding:10px;margin:10px 0}.error{color:#b00020;min-height:1em}button{padding:9px 14px;margin-right:8px}</style></head><body><h1>Multi-Step Form</h1><form id="wizard" novalidate>
<section class="step active"><h2>Step 1: Name</h2><label for="name">Name</label><input id="name" autocomplete="name"><p class="error"></p></section>
<section class="step"><h2>Step 2: Email</h2><label for="email">Email</label><input id="email" type="email" autocomplete="email"><p class="error"></p></section>
<section class="step"><h2>Step 3: Password</h2><label for="password">Password</label><input id="password" type="password" minlength="6"><p class="error"></p></section>
<button id="back" type="button" disabled>Back</button><button id="next" type="button">Next</button></form><section id="summary" hidden><h2>Summary</h2><p id="summary-text"></p><button id="edit" type="button">Edit details</button></section>
<script>
const form=document.querySelector("#wizard"),steps=[...document.querySelectorAll(".step")],fields=[...form.querySelectorAll("input")],back=document.querySelector("#back"),next=document.querySelector("#next"),summary=document.querySelector("#summary");let index=0;
function valid(i){const f=fields[i],error=f.nextElementSibling;let ok=i===0?f.value.trim()!=="":i===1?/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.value):f.value.length>=6;error.textContent=ok?"":(i===0?"Name is required.":i===1?"Enter a valid email.":"Password needs at least 6 characters.");return ok;}
function show(i){index=i;steps.forEach((s,n)=>s.classList.toggle("active",n===i));back.disabled=i===0;next.textContent=i===2?"Finish":"Next";}
next.addEventListener("click",()=>{if(!valid(index)){fields[index].focus();return;}if(index<2)show(index+1);else{form.hidden=true;summary.hidden=false;document.querySelector("#summary-text").textContent=`Name: ${fields[0].value.trim()} | Email: ${fields[1].value.trim()} | Password: ${"*".repeat(fields[2].value.length)}`;}});back.addEventListener("click",()=>{if(index>0)show(index-1);});fields.forEach((f,i)=>f.addEventListener("input",()=>{if(f.nextElementSibling.textContent)valid(i);}));document.querySelector("#edit").addEventListener("click",()=>{summary.hidden=true;form.hidden=false;show(0);});
</script></body></html>

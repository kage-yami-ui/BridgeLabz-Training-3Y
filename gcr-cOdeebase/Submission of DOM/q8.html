<!-- Q8_custom_dropdown -->

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Dropdown</title><style>body{font:16px Arial;padding:40px}.dropdown{position:relative;display:inline-block}#toggle{min-width:200px;padding:12px;text-align:left}#options{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;padding:5px;margin:0;list-style:none;border:1px solid #ccc;background:white;box-shadow:0 4px 12px #0002}#options[hidden]{display:none}#options button{width:100%;padding:10px;text-align:left;border:0;background:white;cursor:pointer}#options button:hover{background:#e8f0fe}</style></head><body><h1>Custom Dropdown</h1><div class="dropdown" id="dropdown"><button id="toggle" aria-expanded="false" type="button">Choose a course ▾</button><ul id="options" hidden><li><button data-value="JavaScript">JavaScript</button></li><li><button data-value="Java">Java</button></li><li><button data-value="Python">Python</button></li><li><button data-value="Web Development">Web Development</button></li></ul></div><p id="selection">No option selected.</p><script>
const dropdown=document.querySelector("#dropdown"),toggle=document.querySelector("#toggle"),options=document.querySelector("#options");toggle.addEventListener("click",()=>{options.hidden=!options.hidden;toggle.setAttribute("aria-expanded",String(!options.hidden));});options.addEventListener("click",e=>{const button=e.target.closest("button[data-value]");if(!button)return;toggle.textContent=button.dataset.value+" ▾";document.querySelector("#selection").textContent="Selected: "+button.dataset.value;options.hidden=true;toggle.setAttribute("aria-expanded","false");});document.addEventListener("click",e=>{if(!dropdown.contains(e.target)){options.hidden=true;toggle.setAttribute("aria-expanded","false");}},true);
</script></body></html>

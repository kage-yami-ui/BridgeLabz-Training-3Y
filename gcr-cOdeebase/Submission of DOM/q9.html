<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Validation</title><style>body{font:16px Arial;max-width:520px;margin:40px auto;padding:0 16px}label{display:block;margin-top:14px}input{box-sizing:border-box;width:100%;padding:10px;margin-top:5px}.error{min-height:1em;color:#b00020;margin:4px 0;font-size:.9rem}#success{color:#147a35;font-weight:bold}button{padding:10px 16px;margin-top:10px}</style></head><body><h1>Registration Form</h1><form id="form" novalidate><label for="name">Name (required)</label><input id="name"><p class="error"></p><label for="email">Email (must contain @)</label><input id="email" type="email"><p class="error"></p><label for="password">Password (minimum 6 characters)</label><input id="password" type="password"><p class="error"></p><button type="submit">Submit</button></form><p id="success" role="status"></p><script>
const form=document.querySelector("#form"),success=document.querySelector("#success");const fields=[{input:document.querySelector("#name"),error:document.querySelector("#name").nextElementSibling,check:v=>v.trim().length>0,message:"Name is required."},{input:document.querySelector("#email"),error:document.querySelector("#email").nextElementSibling,check:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),message:"Enter a valid email address containing @."},{input:document.querySelector("#password"),error:document.querySelector("#password").nextElementSibling,check:v=>v.length>=6,message:"Password must be at least 6 characters."}];
function validate(field){const ok=field.check(field.input.value);field.error.textContent=ok?"":field.message;field.input.setAttribute("aria-invalid",String(!ok));return ok;}
fields.forEach(f=>f.input.addEventListener("input",()=>{success.textContent="";if(form.dataset.submitted==="true")validate(f);}));form.addEventListener("submit",e=>{e.preventDefault();form.dataset.submitted="true";const valid=fields.map(validate).every(Boolean);if(!valid){success.textContent="";fields.find(f=>f.error.textContent)?.input.focus();return;}success.textContent="Form Submitted Successfully";});
</script></body></html>

<!-- Q5_image_gallery_modal -->

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Gallery Modal</title><style>body{font:16px Arial;margin:30px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:900px}.gallery img{width:100%;height:170px;object-fit:cover;cursor:pointer;border-radius:8px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#000c}.modal.open{display:flex}.modal-content{max-width:90vw;max-height:90vh}.modal-content img{max-width:100%;max-height:85vh}@media(max-width:600px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><h1>Image Gallery</h1><p>Click an image to preview; click outside to close.</p><div class="gallery" id="gallery">
<img src="https://picsum.photos/id/1015/400/260" alt="Mountain river"><img src="https://picsum.photos/id/1016/400/260" alt="Forest landscape"><img src="https://picsum.photos/id/1025/400/260" alt="Dog portrait"><img src="https://picsum.photos/id/1035/400/260" alt="Green forest"><img src="https://picsum.photos/id/1043/400/260" alt="Mountain scenery"><img src="https://picsum.photos/id/1069/400/260" alt="Ocean waves"></div><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-content" id="modal-content"><img id="large-image" alt="Expanded preview"></div></div>
<script>
const gallery=document.querySelector("#gallery"),modal=document.querySelector("#modal"),content=document.querySelector("#modal-content"),large=document.querySelector("#large-image");
gallery.addEventListener("click",e=>{const img=e.target.closest("img");if(!img)return;large.src=img.src.replace("/400/260","/1200/800");large.alt=img.alt;modal.classList.add("open");});modal.addEventListener("click",()=>modal.classList.remove("open"));content.addEventListener("click",e=>e.stopPropagation());document.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open");});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Table Filter</title><style>body{font:16px Arial;max-width:760px;margin:35px auto;padding:0 16px}input{box-sizing:border-box;width:100%;padding:10px;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;text-align:left;padding:10px}th{background:#eee}#no-results{color:#b00020}</style></head><body><h1>Student Directory</h1><label for="search">Search by name, branch, or CGPA</label><input id="search" placeholder="Start typing"><table><thead><tr><th>Name</th><th>Branch</th><th>CGPA</th></tr></thead><tbody id="rows"><tr><td>Aarav Sharma</td><td>CSE</td><td>8.7</td></tr><tr><td>Diya Patel</td><td>IT</td><td>9.1</td></tr><tr><td>Rohan Verma</td><td>AI &amp; DS</td><td>8.2</td></tr><tr><td>Meera Singh</td><td>CSE</td><td>9.4</td></tr><tr><td>Kabir Khan</td><td>ECE</td><td>7.9</td></tr></tbody></table><p id="no-results" hidden>No results found</p><script>
const search=document.querySelector("#search"),rows=[...document.querySelectorAll("#rows tr")],message=document.querySelector("#no-results");search.addEventListener("input",()=>{const query=search.value.trim().toLowerCase();let count=0;rows.forEach(row=>{const match=row.textContent.toLowerCase().includes(query);row.hidden=!match;if(match)count++;});message.hidden=count!==0;});
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <h1 class="gallery-title">CSS Photo Gallery</h1>
    
    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300?text=Nature+1" alt="Gallery Image 1">
            <div class="caption">Majestic Mountains</div>
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300?text=Nature+2" alt="Gallery Image 2">
            <div class="caption">Ocean Breeze</div>
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300?text=Nature+3" alt="Gallery Image 3">
            <div class="caption">Forest Path</div>
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300?text=Nature+4" alt="Gallery Image 4">
            <div class="caption">Sunset Glow</div>
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300?text=Nature+5" alt="Gallery Image 5">
            <div class="caption">Desert Dunes</div>
        </div>

        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300?text=Nature+6" alt="Gallery Image 6">
            <div class="caption">City Lights</div>
        </div>
    </div>
</body>
</html>

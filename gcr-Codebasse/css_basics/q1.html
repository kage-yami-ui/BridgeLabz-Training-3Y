<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <!-- Fixed Header Navigation -->
    <header class="navbar">
        <div class="logo">Jane Doe</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="content">
        <section id="home" class="hero">
            <img src="https://via.placeholder.com/180" alt="Jane Doe Profile" class="profile-img">
            <div class="bio">
                <h1>Hello, I'm Jane Doe</h1>
                <p>I am a passionate web developer and UI designer focused on building accessible, modern, and user-friendly interfaces. Welcome to my personal homepage!</p>
            </div>
        </section>
    </main>

    <!-- Flexbox Footer Always at Bottom -->
    <footer class="footer">
        <p>&copy; 2026 Jane Doe. All rights reserved.</p>
    </footer>
</body>
</html>

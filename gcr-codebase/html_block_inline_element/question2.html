<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Product Catalog</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="https://via.placeholder.com/100" alt="Wireless Headphones"></td>
                <td>Wireless Headphones</td>
                <td>Noise-canceling over-ear headphones.</td>
                <td>$99.99</td>
                <td>In Stock</td>
            </tr>
            <tr>
                <td><img src="https://via.placeholder.com/100" alt="Smartwatch"></td>
                <td>Smartwatch</td>
                <td>Fitness tracker with heart rate monitor.</td>
                <td>$149.99</td>
                <td>Out of Stock</td>
            </tr>
            <tr>
                <td colspan="5" align="center">End of Catalog</td>
            </tr>
        </tbody>
    </table>
</body>
</html>

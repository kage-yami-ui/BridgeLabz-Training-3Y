<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report Card</title>
</head>
<body>
    <h1>Springfield High School</h1>

    <table border="1" title="Academic Performance Summary">
        <thead>
            <tr>
                <th>Student Details</th>
                <th>Subject</th>
                <th>Marks Obtained</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="5">Name: Alex Smith<br>Grade: 10th</td>
                <td>Mathematics</td>
                <td>95</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>88</td>
            </tr>
            <tr>
                <td>English</td>
                <td>92</td>
            </tr>
            <tr>
                <td>History</td>
                <td>84</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>98</td>
            </tr>
            <tr>
                <td colspan="2"><strong>Total Marks</strong></td>
                <td><strong>457 / 500</strong></td>
            </tr>
            <tr>
                <td colspan="2"><strong>Percentage</strong></td>
                <td><strong>91.4%</strong></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
